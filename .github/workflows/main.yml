name: VPEI Deployment

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            # Activate virtualenv
            source /home/VPEI/.venv/bin/activate

            # Go to project
            cd /home/VPEI

            # Pull latest code
            git fetch origin
            git checkout production
            git pull

            # Install/update dependencies
            pip install -r requirements.txt

            # Reload PM2 process
            pm2 reload VPEI
