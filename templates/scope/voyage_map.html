<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hải Trình - Tính Phát Thải</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem;
      --text-xs: clamp(0.7rem, 0.65rem + 0.2vw, 0.78rem);
      --text-sm: clamp(0.78rem, 0.73rem + 0.2vw, 0.875rem);
      --text-base: clamp(0.85rem, 0.8rem + 0.25vw, 0.95rem);
      --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px;
      --panel-bg: #0d1b2a;
      --panel-surface: #112240;
      --panel-border: #1e3a5f;
      --accent: #1976d2;
      --accent-light: #64b5f6;
      --text-primary: #e0e0e0;
      --text-muted: #90a4ae;
      --text-faint: #546e7a;
      --green: #4caf50;
      --red: #ef5350;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--panel-bg);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: var(--text-sm);
    }

    header {
      padding: var(--space-2) var(--space-4);
      background: var(--panel-surface);
      border-bottom: 2px solid var(--accent);
      display: flex; align-items: center; gap: var(--space-3);
      flex-shrink: 0;
    }
    header h1 { font-size: var(--text-base); color: var(--accent-light); white-space: nowrap; font-weight: 700; }
    header span { color: var(--text-faint); font-size: var(--text-xs); }

    #main-layout { display: flex; flex: 1; overflow: hidden; }

    #left-panel {
      width: 300px;
      min-width: 260px;
      max-width: 300px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex; flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #panel-header {
      padding: var(--space-2) var(--space-3);
      background: var(--panel-surface);
      border-bottom: 1px solid var(--panel-border);
      font-size: var(--text-xs);
      color: var(--accent-light);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      flex-shrink: 0;
    }

    #hint-box {
      margin: var(--space-2) var(--space-3);
      background: rgba(25,118,210,0.10);
      border: 1px solid rgba(25,118,210,0.35);
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-xs);
      color: #90caf9;
      line-height: 1.55;
      flex-shrink: 0;
    }

    #port-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-2) var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .port-card {
      background: var(--panel-surface);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: var(--space-2) var(--space-3);
      width: 100%;
    }
    .port-card.error { border-color: rgba(239,83,80,0.6); }

    .port-card-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
      min-height: 24px;
    }
    .port-num {
      background: var(--accent);
      color: white;
      border-radius: 50%;
      width: 20px; height: 20px;
      min-width: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-xs); font-weight: 700;
      flex-shrink: 0;
    }
    .port-title {
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--text-primary);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .remove-btn {
      background: rgba(211,47,47,0.12);
      border: 1px solid rgba(211,47,47,0.4);
      color: #ef9a9a;
      border-radius: var(--radius-sm);
      padding: 2px 6px;
      font-size: var(--text-xs);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
      line-height: 1.4;
    }
    .remove-btn:hover { background: rgba(211,47,47,0.3); }

    .no-route-badge {
      display: inline-block;
      background: rgba(239,83,80,0.15);
      border: 1px solid rgba(239,83,80,0.5);
      color: #ef9a9a;
      border-radius: 10px;
      padding: 1px 6px;
      font-size: var(--text-xs);
      white-space: nowrap;
    }

    .port-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-1);
      width: 100%;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .field-group label {
      font-size: var(--text-xs);
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .field-group input {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 3px 6px;
      font-size: var(--text-xs);
      width: 100%;
      min-width: 0;
      transition: border-color 0.15s;
    }
    .field-group input:focus { border-color: var(--accent); outline: none; }
    .field-group input[readonly] { color: var(--text-muted); cursor: default; }
    .field-group input::placeholder { color: var(--text-faint); }

    #add-port-map-btn {
      margin: 0 var(--space-3) var(--space-2);
      padding: var(--space-2);
      background: rgba(25,118,210,0.1);
      border: 1.5px dashed var(--accent);
      border-radius: var(--radius-lg);
      color: #90caf9;
      font-size: var(--text-xs);
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    #add-port-map-btn:hover { background: rgba(25,118,210,0.25); }
    #add-port-map-btn.selecting {
      background: rgba(76,175,80,0.15);
      border-color: #4caf50;
      color: #a5d6a7;
    }

    #complete-btn {
      margin: 0 var(--space-3) var(--space-3);
      padding: var(--space-2) var(--space-3);
      background: #0d2137;
      border: 2px solid var(--accent);
      border-radius: var(--radius-lg);
      color: var(--accent-light);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    #complete-btn:hover { background: var(--accent); color: white; }

    #map-container { flex: 1; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    #select-overlay {
      display: none;
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000;
      background: rgba(25,118,210,0.95);
      border-radius: 20px;
      padding: 7px 18px;
      font-size: var(--text-xs);
      color: white; font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
    }
    #select-overlay.active { display: block; }

    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .port-marker-wrap {
      display: flex; align-items: center; justify-content: center;
    }
    .port-dot {
      width: 13px; height: 13px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .port-dot.pulse {
      animation: portPulse 1.4s ease-in-out infinite;
    }
    @keyframes portPulse {
      0%,100% { box-shadow: 0 0 5px 1px rgba(100,181,246,0.5); }
      50% { box-shadow: 0 0 12px 4px rgba(100,181,246,0.95); }
    }

    .order-label {
      background: #1976d2;
      color: white;
      border-radius: 50%;
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      line-height: 1;
    }

    #port-list::-webkit-scrollbar { width: 4px; }
    #port-list::-webkit-scrollbar-track { background: transparent; }
    #port-list::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }
  </style>
</head>
<body>
<header>
  <h1>🚢 Hải Trình</h1>
  <span>Chọn cảng trên bản đồ để lập hải trình &amp; tính phát thải</span>
</header>

<div id="main-layout">
  <div id="left-panel">
    <div id="panel-header">📍 Danh sách cảng (tối thiểu 2)</div>
    <div id="hint-box">
      💡 Nhấn <b>+ Thêm cảng</b> rồi click vào cảng trên bản đồ hoặc tuyến nối với cảng cuối cùng.
    </div>
    <div id="port-list"></div>
    <div id="add-port-map-btn" onclick="toggleSelectMode()">
      ➕ Thêm cảng từ bản đồ
    </div>
    <button id="complete-btn" onclick="completeVoyage()">
      ✅ Hoàn tất hải trình
    </button>
  </div>

  <div id="map-container">
    <div id="select-overlay">🖱️ Click vào cảng hoặc tuyến kết nối để thêm... (click nền để huỷ)</div>
    <div id="map"></div>
  </div>
</div>
<script src="/scope3/voyage_route_data"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const { RAW_ROUTES_DATA, PORT_COLORS, PORT_NAMES, PORT_COUNTRIES } = VOYAGE_ROUTES;

function buildCanonicalPortRegistry(rawRoutes) {
  const acc = {};
  rawRoutes.forEach(route => {
    const endpoints = [
      { code: route.from, coord: route.coords[0] },
      { code: route.to, coord: route.coords[route.coords.length - 1] }
    ];
    endpoints.forEach(({ code, coord }) => {
      if (!acc[code]) acc[code] = [];
      acc[code].push(coord);
    });
  });

  const registry = {};
  Object.entries(acc).forEach(([code, coords]) => {
    const avgLng = coords.reduce((s, c) => s + c[0], 0) / coords.length;
    const avgLat = coords.reduce((s, c) => s + c[1], 0) / coords.length;
    registry[code] = {
      code,
      coord: [avgLng, avgLat],
      samples: coords
    };
  });
  return registry;
}

function normalizeRoutesByPortRegistry(rawRoutes, registry) {
  return rawRoutes.map(route => {
    const normalizedCoords = route.coords.map(c => [...c]);
    normalizedCoords[0] = [...registry[route.from].coord];
    normalizedCoords[normalizedCoords.length - 1] = [...registry[route.to].coord];
    return { ...route, coords: normalizedCoords };
  });
}

const portRegistry = buildCanonicalPortRegistry(RAW_ROUTES_DATA);
const ROUTES_DATA = normalizeRoutesByPortRegistry(RAW_ROUTES_DATA, portRegistry);

const routeMap = {};
ROUTES_DATA.forEach(r => {
  if (!routeMap[r.from]) routeMap[r.from] = {};
  routeMap[r.from][r.to] = r;

  if (!routeMap[r.to]) routeMap[r.to] = {};
  if (!routeMap[r.to][r.from]) {
    routeMap[r.to][r.from] = {
      id: r.id + '_REV',
      fullName: (PORT_NAMES[r.to] || r.to) + ' → ' + (PORT_NAMES[r.from] || r.from),
      from: r.to,
      to: r.from,
      style: r.style,
      coords: [...r.coords].reverse()
    };
  }
});

function findRoute(from, to) {
  return (routeMap[from] && routeMap[from][to]) || null;
}

const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const allLL = [];
ROUTES_DATA.forEach(r => r.coords.forEach(c => allLL.push([c[1], c[0]])));
map.fitBounds(L.latLngBounds(allLL), { padding:[40,40] });

const baseLayers = {};
const adjacencyMap = {};
ROUTES_DATA.forEach(r => {
  const lls = r.coords.map(c => [c[1], c[0]]);
  const line = L.polyline(lls, {
    color: r.style.color, weight: r.style.width,
    opacity: 0.3, dashArray: r.style.dashArray
  }).addTo(map);
  line.bindTooltip(`<b>${r.fullName}</b>`, { sticky:true });
  baseLayers[r.id] = line;

  if (!adjacencyMap[r.from]) adjacencyMap[r.from] = [];
  adjacencyMap[r.from].push({ route: r, layer: line, from: r.from, to: r.to });

  if (!adjacencyMap[r.to]) adjacencyMap[r.to] = [];
  adjacencyMap[r.to].push({
    route: {
      id: r.id + '_REV_BASE',
      fullName: (PORT_NAMES[r.to]||r.to) + ' → ' + (PORT_NAMES[r.from]||r.from),
      from: r.to,
      to: r.from,
      style: r.style,
      coords: [...r.coords].reverse()
    },
    layer: line,
    from: r.to,
    to: r.from
  });
});

let selectingMode = false;
let lastHoveredAdjLayer = null;
const portMarkers = {};
Object.keys(portRegistry).forEach(code => {
  const p = portRegistry[code];
  const latlng = [p.coord[1], p.coord[0]];
  const col = PORT_COLORS[code] || '#90caf9';
  const icon = L.divIcon({
    html: `<div class="port-dot" style="background:${col}" title="${PORT_NAMES[code]||code}"></div>`,
    iconSize:[13,13], iconAnchor:[6,6], className:'port-marker-wrap'
  });
  const marker = L.marker(latlng, { icon, zIndexOffset:600 }).addTo(map);
  marker.bindTooltip(`<b>${PORT_COUNTRIES[code]||''} ${PORT_NAMES[code]||code}</b> (${code})`, {sticky:true});
  marker.on('click', e => {
    L.DomEvent.stopPropagation(e);
    if (!selectingMode) return;
    addPortToList(code);
    stopSelectMode();
  });
  portMarkers[code] = marker;
});

map.on('click', () => { if (selectingMode) stopSelectMode(); });

function toggleSelectMode() {
  if (selectingMode) { stopSelectMode(); return; }
  startSelectMode();
}

function startSelectMode() {
  selectingMode = true;
  document.getElementById('select-overlay').classList.add('active');
  document.getElementById('add-port-map-btn').classList.add('selecting');
  document.getElementById('add-port-map-btn').textContent = '✕ Huỷ chọn cảng';
  map.getContainer().style.cursor = 'crosshair';
  Object.values(portMarkers).forEach(m => {
    const el = m.getElement();
    if (el) el.querySelector('.port-dot').classList.add('pulse');
  });

  if (portList.length > 0) {
    const last = portList[portList.length - 1];
    const pr = portRegistry[last.code];
    if (pr) map.flyTo([pr.coord[1], pr.coord[0]], Math.max(map.getZoom(), 6), {duration:0.6});
  }

  attachAdjacencyEventsForLastPort();
}

function stopSelectMode() {
  selectingMode = false;
  document.getElementById('select-overlay').classList.remove('active');
  document.getElementById('add-port-map-btn').classList.remove('selecting');
  document.getElementById('add-port-map-btn').textContent = '➕ Thêm cảng từ bản đồ';
  map.getContainer().style.cursor = '';
  Object.values(portMarkers).forEach(m => {
    const el = m.getElement();
    if (el) el.querySelector('.port-dot').classList.remove('pulse');
  });
  clearAdjacencyEvents();
}

function clearAdjacencyEvents() {
  Object.values(adjacencyMap).forEach(list => {
    list.forEach(item => {
      const layer = item.layer;
      layer.off('mouseover');
      layer.off('mouseout');
      layer.off('click');
      layer.setStyle({weight: item.route.style.width, opacity:0.3});
    });
  });
  lastHoveredAdjLayer = null;
}

function attachAdjacencyEventsForLastPort() {
  clearAdjacencyEvents();
  if (portList.length === 0) return;
  const last = portList[portList.length - 1];
  const code = last.code;
  const adjList = adjacencyMap[code] || [];

  adjList.forEach(item => {
    const layer = item.layer;
    const { route, from, to } = item;

    layer.on('mouseover', () => {
      lastHoveredAdjLayer = layer;
      layer.setStyle({weight: route.style.width + 2, opacity:0.9});
      layer.bindTooltip(`<b>${PORT_NAMES[from]||from}</b> → <b>${PORT_NAMES[to]||to}</b>`, {sticky:true}).openTooltip();
    });
    layer.on('mouseout', () => {
      if (lastHoveredAdjLayer === layer) lastHoveredAdjLayer = null;
      layer.setStyle({weight: route.style.width, opacity:0.3});
    });
    layer.on('click', e => {
      L.DomEvent.stopPropagation(e);
      addPortToList(to);
      stopSelectMode();
    });
  });
}

let portList = [];
let previewLayers = [];
let orderBadges = [];

function calcDist(coords) {
  let d = 0;
  const lls = coords.map(c => [c[1], c[0]]);
  for (let i = 0; i < lls.length - 1; i++) d += map.distance(lls[i], lls[i+1]);
  return { km: (d/1000).toFixed(0), nm: (d/1852).toFixed(0) };
}

function addPortToList(code) {
  const name = PORT_NAMES[code] || code;
  const flag = PORT_COUNTRIES[code] || '';
  const p = portRegistry[code];
  portList.push({
    code, name, flag,
    lat: p.coord[1].toFixed(4),
    lng: p.coord[0].toFixed(4),
    eta:'', etd:'', channelDist:'', seaDist:''
  });

  if (portList.length >= 2) {
    const prev = portList[portList.length - 2];
    const route = findRoute(prev.code, code);
    prev.seaDist = route ? calcDist(route.coords).km : '';
  }

  renderPortList();
  updatePreview();
  map.flyTo([p.coord[1], p.coord[0]], Math.max(map.getZoom(), 6), {duration:0.8});
}

function removePort(idx) {
  portList.splice(idx, 1);
  if (idx > 0 && idx <= portList.length) {
    const prev = portList[idx-1];
    const next = portList[idx];
    if (next) {
      const route = findRoute(prev.code, next.code);
      prev.seaDist = route ? calcDist(route.coords).km : '';
    } else {
      prev.seaDist = '';
    }
  }
  renderPortList();
  updatePreview();
}

function centerPortOnMap(code) {
  const p = portRegistry[code];
  if (!p) return;
  map.flyTo([p.coord[1], p.coord[0]], Math.max(map.getZoom(), 7), {duration:0.6});
}

function renderPortList() {
  const container = document.getElementById('port-list');
  container.innerHTML = '';
  if (portList.length === 0) {
    container.innerHTML = `<div style="text-align:center;color:var(--text-faint);font-size:var(--text-xs);padding:var(--space-8) 0;">Chưa có cảng nào được thêm</div>`;
    return;
  }

  portList.forEach((p, i) => {
    const prevP = i > 0 ? portList[i-1] : null;
    const route = prevP ? findRoute(prevP.code, p.code) : null;
    const hasError = prevP && !route;
    const noRouteHtml = hasError ? `<span class="no-route-badge">✗ Không có tuyến</span>` : '';

    const card = document.createElement('div');
    card.className = `port-card${hasError ? ' error' : ''}`;
    card.innerHTML = `
      <div class="port-card-header">
        <div class="port-num">${i+1}</div>
        <span class="port-title" onclick="centerPortOnMap('${p.code}')">${p.flag} ${p.name} (${p.code})</span>
        ${noRouteHtml}
        <button class="remove-btn" onclick="removePort(${i})">Xóa</button>
      </div>
      <div class="port-fields">
        <div class="field-group">
          <label>Mã cảng</label>
          <input type="text" value="${p.code}" readonly />
        </div>
        <div class="field-group">
          <label>Tên cảng</label>
          <input type="text" value="${p.name}" readonly />
        </div>
        <div class="field-group">
          <label>Arrival (ETA)</label>
          <input type="datetime-local" value="${p.eta}" onchange="portList[${i}].eta=this.value" />
        </div>
        <div class="field-group">
          <label>Departure (ETD)</label>
          <input type="datetime-local" value="${p.etd}" onchange="portList[${i}].etd=this.value" />
        </div>
        <div class="field-group">
          <label>Channel Dist (km)</label>
          <input type="number" placeholder="VD: 15" value="${p.channelDist}" onchange="portList[${i}].channelDist=this.value" />
        </div>
        <div class="field-group">
          <label>Sea Dist to Next (km)</label>
          <input type="number" placeholder="—" value="${p.seaDist}" onchange="portList[${i}].seaDist=this.value" />
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function applyDashAnimation(line) {
  const el = line.getElement();
  if (el) el.style.animation = 'dashMove 0.8s linear infinite';
  line.on('add', () => {
    const svg = line.getElement();
    if (svg) svg.style.animation = 'dashMove 0.8s linear infinite';
  });
}

function updatePreview() {
  previewLayers.forEach(l => map.removeLayer(l));
  previewLayers = [];
  orderBadges.forEach(b => map.removeLayer(b));
  orderBadges = [];

  ROUTES_DATA.forEach(r => baseLayers[r.id].setStyle({opacity:0.28}));
  if (portList.length === 0) return;

  portList.forEach((p, i) => {
    if (i === 0) return;
    const from = portList[i-1];
    const to = p;
    const route = findRoute(from.code, to.code);

    if (route) {
      const originalId = route.id.endsWith('_REV') ? route.id.replace('_REV','') : route.id.replace('_REV_BASE','');
      if (baseLayers[originalId]) baseLayers[originalId].setStyle({opacity:0.15});

      const lls = route.coords.map(c => [c[1], c[0]]);
      const shadow = L.polyline(lls, {
        color: route.style.color, weight: 9, opacity: 0.18, dashArray: null
      }).addTo(map);
      previewLayers.push(shadow);

      const animLine = L.polyline(lls, {
        color: route.style.color, weight: 4, opacity: 1,
        dashArray: '12 8', dashOffset: '0'
      }).addTo(map);
      previewLayers.push(animLine);
      applyDashAnimation(animLine);
    } else {
      const fromCoord = portRegistry[from.code].coord;
      const toCoord = portRegistry[to.code].coord;
      const straightLine = L.polyline(
        [[fromCoord[1],fromCoord[0]], [toCoord[1],toCoord[0]]],
        { color:'#ef5350', weight:4, opacity:0.95, dashArray:'10 8' }
      ).addTo(map);
      previewLayers.push(straightLine);
      applyDashAnimation(straightLine);
    }
  });

  // Tính số lần xuất hiện mỗi code để xử lý trùng
  const duplicateCountMap = {};
  portList.forEach(p => {
    duplicateCountMap[p.code] = (duplicateCountMap[p.code] || 0) + 1;
  });

  const duplicateUsedMap = {};
  portList.forEach((p, i) => {
    const pr = portRegistry[p.code];
    if (!pr) return;

    duplicateUsedMap[p.code] = (duplicateUsedMap[p.code] || 0) + 1;
    const dupIndex = duplicateUsedMap[p.code] - 1;

    const pixelOffsetX = dupIndex * 16;   // lệch ngang nếu trùng
    const pixelOffsetY = -20;             // nhô lên trên marker

    const badgeIcon = L.divIcon({
      html: `<div class="order-label" style="transform: translate(${pixelOffsetX}px, ${pixelOffsetY}px);">${i+1}</div>`,
      iconSize: [18,18],
      iconAnchor: [9,9],
      className: ''
    });

    const badge = L.marker([pr.coord[1], pr.coord[0]], {
      icon: badgeIcon,
      zIndexOffset: 700,
      interactive: false
    }).addTo(map);
    orderBadges.push(badge);
  });

  if (portList.length >= 2) {
    const coords = portList.map(p => {
      const pr = portRegistry[p.code];
      return [pr.coord[1], pr.coord[0]];
    });
    map.fitBounds(L.latLngBounds(coords), {padding:[80,80], maxZoom:8});
  }
}

function completeVoyage() {
  if (portList.length < 2) {
    alert('⚠️ Vui lòng thêm ít nhất 2 cảng trước khi hoàn tất!');
    return;
  }

  const validSegments = [];
  for (let i = 1; i < portList.length; i++) {
    const from = portList[i - 1];
    const to = portList[i];
    const route = findRoute(from.code, to.code);

    if (route) {
      const d = calcDist(route.coords);
      validSegments.push({
        leg: i,
        fromCode: from.code,
        toCode: to.code,
        fromName: from.name,
        toName: to.name,
        km: Number(d.km),
        nm: Number(d.nm)
      });
    } else {
      validSegments.push({
        leg: i,
        fromCode: from.code,
        toCode: to.code,
        fromName: from.name,
        toName: to.name,
        km: null,
        nm: null
      });
    }
  }

  const payload = {
    type: 'SHIP_VOYAGE_RESULT',
    ports: portList.map((p, idx) => ({
      order: idx + 1,
      code: p.code,
      name: p.name,
      flag: p.flag || '',
      eta: p.eta || '',
      etd: p.etd || '',
      channelDist: p.channelDist || '',
      seaDist: p.seaDist || '',
      lat: p.lat || '',
      lng: p.lng || ''
    })),
    segments: validSegments
  };

  window.parent.postMessage(payload, '*');
}

renderPortList();
</script>
