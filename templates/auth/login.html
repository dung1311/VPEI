<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="/static/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEI – Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0d1f3c; --navy-mid:#152850; --navy-light:#1e3a6e; --accent:#2e7df7; --accent-light:#5a9bff; --white:#ffffff; --gray-soft:#f4f6fb; --gray-border:#dde3ef; --text-muted:#7a8aab; }
  * { font-family:'DM Sans',sans-serif; box-sizing:border-box; }
  h1,h2,.logo-text { font-family:'Sora',sans-serif; }
  body { margin:0; padding:0; display:flex; height:100vh; overflow:hidden; }
  .left-panel { background: #ffffff; width:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .corner-logo {
    position: absolute;
    top: 22px;
    left: 22px;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 26px rgba(0,0,0,.08);
    z-index: 3;
    text-decoration: none;
  }
  .corner-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }
  .logo-area { position:relative; z-index:2; text-align:center; }
  .logo-text { font-size:3rem; font-weight:800; color:var(--navy); letter-spacing:-1px; line-height:1; }
  .logo-text .accent { color:var(--accent); }
  .brand-title { font-family:'Sora',sans-serif; font-size:1.75rem; font-weight:700; color:var(--navy); line-height:1.3; margin-bottom:12px; }
  .brand-sub { font-size:.95rem; color:var(--text-muted); letter-spacing:.05em; text-transform:uppercase; font-weight:500; }
  .particle { position:absolute; border-radius:50%; background:rgba(46,125,247,.15); animation:float 6s ease-in-out infinite; }
  .particle:nth-child(1){width:8px;height:8px;top:20%;left:15%;animation-delay:0s}
  .particle:nth-child(2){width:5px;height:5px;top:60%;left:25%;animation-delay:2s}
  .particle:nth-child(3){width:10px;height:10px;top:40%;right:20%;animation-delay:1s}
  .particle:nth-child(4){width:6px;height:6px;top:75%;right:30%;animation-delay:3s}
  @keyframes float{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-20px);opacity:.8}}
  .right-panel { background:linear-gradient(145deg,var(--navy) 0%,var(--navy-mid) 50%,var(--navy-light) 100%); width:50%; display:flex; align-items:center; justify-content:center; padding:40px; position:relative; }
  .right-panel::before { content:''; position:absolute; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 70%); top:-50px; right:-100px; }
  .grid-overlay { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; }
  .form-card { width:100%; max-width:400px; position:relative; z-index:2; }
  .form-title { font-family:'Sora',sans-serif; font-size:2rem; font-weight:800; color:white; letter-spacing:-.5px; text-align:center; margin-bottom:36px; }
  .form-group { margin-bottom:20px; }
  label { display:block; font-size:.875rem; font-weight:500; color:rgba(255,255,255,.7); margin-bottom:8px; }
  input[type="text"],input[type="password"] { width:100%; padding:13px 16px; border:1px solid rgba(255,255,255,.15); border-radius:10px; font-size:.95rem; color:white; background:rgba(255,255,255,.05); outline:none; transition:all .2s; }
  input:focus { border-color:var(--accent-light); background:rgba(255,255,255,.1); box-shadow:0 0 0 3px rgba(46,125,247,.2); }
  .password-wrapper { position:relative; }
  .password-wrapper input { padding-right:46px; }
  .toggle-pwd { position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:rgba(255,255,255,.5); background:none; border:none; font-size:1.1rem; padding:0; }
  .form-options { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; margin-top:8px; }
  .forgot { font-size:.85rem; color:var(--accent-light); text-decoration:none; font-weight:500; }
  .forgot:hover { text-decoration:underline; }
  .remember { display:flex; align-items:center; gap:7px; font-size:.85rem; color:rgba(255,255,255,.7); cursor:pointer; }
  .remember input[type="checkbox"] { accent-color:var(--accent-light); width:15px; height:15px; }
  .btn-signin { width:100%; padding:14px; background:var(--accent); color:white; font-family:'Sora',sans-serif; font-size:.95rem; font-weight:700; letter-spacing:.1em; border:none; border-radius:10px; cursor:pointer; transition:all .25s; box-shadow:0 4px 15px rgba(46,125,247,.3); }
  .btn-signin:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(46,125,247,.5); background:var(--accent-light); }
  .form-hint { text-align:center; margin-top:20px; font-size:.82rem; color:rgba(255,255,255,.5); line-height:1.5; }
  .error-msg { background:rgba(255,82,82,.1); border:1px solid rgba(255,82,82,.3); border-radius:8px; padding:10px 14px; color:#ff8a80; font-size:.85rem; margin-bottom:20px; text-align:center; }
  @media(max-width:768px){.left-panel{display:none}.right-panel{width:100%}}
</style>
</head>
<body>
<div class="left-panel" style="background-color: #ffffff;">
  <div class="logo-area" style="display: flex; flex-direction: column; align-items: center;">
    <a href="/" style="display: block; margin-bottom: 20px;">
      <img src="/static/white_alphabet.png" alt="VPEI Alphabet Logo" style="width: 500px; height: auto; max-width: 90%; display: block; border-radius: 12px; box-shadow: none;">
    </a>
    <!-- <div style="font-family: 'Sora', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--navy); letter-spacing: 0.05em; text-align: center; text-transform: uppercase;">
      vietnam port emissions inventory
    </div> -->
  </div>
</div>
<div class="right-panel">
  <div class="grid-overlay"></div>
  <div class="form-card">
    <div class="form-title">SIGN IN</div>
    {% if error %}<div class="error-msg">⚠ {{ error }}</div>{% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="email">Email / Username</label>
        <input type="text" id="email" name="email" placeholder="example@company.com hoặc username" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" required>
          <button type="button" class="toggle-pwd" onclick="togglePassword()" id="eyeBtn">👁</button>
        </div>
      </div>
      <div class="form-options">
        <a href="#" class="forgot">Forgot Password?</a>
        <label class="remember"><input type="checkbox" name="remember_me" value="true"> Remember Me</label>
      </div>
      <button type="submit" class="btn-signin">SIGN IN</button>
    </form>
    <div class="form-hint">If you forgot your login, please contact<br><strong>vpei.greenport@gmail.com</strong>.</div>
  </div>
</div>
<script>
  function togglePassword(){const p=document.getElementById('password'),b=document.getElementById('eyeBtn');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'👁':'🙈';}
</script>
</body>
</html>
