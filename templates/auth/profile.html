<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPEI – Thông tin cá nhân</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --navy:#0d1f3c; --navy-mid:#152850; --navy-light:#1e3a6e;
  --accent:#2e7df7; --accent-light:#5a9bff;
  --white:#ffffff; --gray-soft:#f4f6fb; --gray-border:#dde3ef;
  --text-muted:#7a8aab; --green:#22c55e; --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Montserrat',sans-serif;background:var(--gray-soft);color:var(--navy);display:flex;height:100vh;overflow:hidden;}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:6px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--gray-border);border-radius:10px;}

/* ─── SIDEBAR ─── */
.sidebar{width:220px;background:var(--white);border-right:1px solid var(--gray-border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sidebar-logo { height: 60px; padding: 0 24px; display: flex; align-items: center; border-bottom: 1px solid var(--gray-border); gap: 10px; flex-shrink: 0; }
.logo-box{background:linear-gradient(135deg,var(--navy),var(--navy-light));border-radius:10px;padding:7px 12px;font-weight:800;font-size:1.1rem;color:white;letter-spacing:1px;}
.nav-items{padding:16px 0;flex:1;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;font-size:.82rem;font-weight:500;color:#4a5a7b;transition:all .2s;text-decoration:none;border-left:3px solid transparent;}
.nav-item:hover{background:var(--gray-soft);color:var(--navy);}
.nav-item.active{background:rgba(46,125,247,.08);color:var(--accent);border-left-color:var(--accent);font-weight:600;}
.nav-item.sub{padding-left:36px;font-size:.77rem;}
.nav-section{padding:6px 20px 4px;font-size:.68rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;}
.nav-expand{font-size:.65rem;margin-left:auto;color:var(--text-muted);}
.nav-bottom{padding:16px 0;border-top:1px solid var(--gray-border);}

.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.content { flex:1; overflow-y:auto; padding:24px 28px; display:flex; gap:20px; align-items: flex-start; justify-content: center; }

.card { background: white; border-radius: 16px; border: 1px solid var(--gray-border); box-shadow: 0 4px 15px rgba(0,0,0,0.02); width: 100%; max-width: 480px; overflow: hidden; }
.card-header { height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; border-bottom: 1px solid var(--gray-border); background: #fafbfd; margin: 0; }
.card-title { font-size: 0.95rem; line-height: 1; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 10px; margin: 0; }
.card-title i { color: var(--accent); font-size: 1.1rem; width: 20px; text-align: center; display: flex; justify-content: center; align-items: center; }
.card-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
.form-input { padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--gray-border); font-size: 0.85rem; font-weight: 600; color: var(--navy); font-family: 'Montserrat', sans-serif; transition: all 0.2s; width: 100%; outline: none; }
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,125,247,0.1); }
.form-input:disabled { background: var(--gray-soft); color: var(--text-muted); cursor: not-allowed; }

.btn { padding: 10px 16px; border-radius: 10px; font-size: 0.82rem; font-weight: 700; font-family: 'Montserrat', sans-serif; cursor: pointer; transition: all 0.2s; border: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-light); box-shadow: 0 4px 12px rgba(46,125,247,0.3); }

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:white;padding:11px 18px;border-radius:12px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:9999;transform:translateY(70px);opacity:0;transition:all .32s cubic-bezier(.34,1.56,.64,1);}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:#16a34a;}
.toast.error{background:var(--red);}

</style>
</head>
<body>

{% include 'components/sidebar.html' %}

<div class="main">
  {% set topbar_title = '<i class="fa-solid fa-address-card" style="color:var(--accent);margin-right:7px;font-size:1rem"></i> Quản lý tài khoản' %}
  {% set hide_period_filter = True %}
  {% include 'components/topbar.html' %}

  <div class="content">
    <div class="card" style="max-width: 540px; width: 100%;">
      <div class="card-header">
        <div class="card-title"><i class="fa-solid fa-user-shield"></i> Thông tin tài khoản & Bảo mật</div>
      </div>
      <div class="card-body" style="display: flex; flex-direction: column; gap: 24px;">
        
        <!-- Thông tin -->
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div class="form-group">
            <label class="form-label">Tên đăng nhập</label>
            <input type="text" class="form-input" value="{{ user_obj.username }}" disabled>
          </div>
          <div class="form-group">
            <label class="form-label">Họ và tên</label>
            <input type="text" class="form-input" value="{{ user_obj.full_name or 'Chưa cập nhật' }}" disabled>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" value="{{ user_obj.email or 'Chưa cập nhật' }}" disabled>
          </div>
          <div class="form-group">
            <label class="form-label">Vai trò</label>
            <input type="text" class="form-input" value="{% if user_obj.is_super_admin %}Super Admin{% elif user_obj.is_admin %}Quản trị viên (Admin){% else %}Người dùng{% endif %}" disabled>
          </div>
        </div>
        
        <div style="border-top: 1px solid var(--gray-border); margin: 0 -24px;"></div>
        
        <!-- Cột đổi mật khẩu -->
        <div style="display:flex;flex-direction:column;gap:12px;">
          <button type="button" id="btn-toggle-pwd" class="btn" style="background: var(--gray-soft); color: var(--navy); border: 1px solid var(--gray-border); font-weight: 700; width: 100%; justify-content: space-between;">
            <span><i class="fa-solid fa-key" style="color: var(--accent); margin-right: 6px;"></i> Đổi mật khẩu</span>
            <i class="fa-solid fa-chevron-down" id="pwd-icon"></i>
          </button>
          
          <form id="form-change-pwd" style="display:none; flex-direction:column; gap:16px; margin-top: 8px;">
            <div class="form-group">
              <label class="form-label">Mật khẩu hiện tại</label>
              <input type="password" id="old-pwd" class="form-input" placeholder="Nhập mật khẩu hiện tại" required>
            </div>
            <div class="form-group">
              <label class="form-label">Mật khẩu mới</label>
              <input type="password" id="new-pwd" class="form-input" placeholder="Tối thiểu 8 ký tự" minlength="8" required>
            </div>
            <div class="form-group">
              <label class="form-label">Nhập lại mật khẩu mới</label>
              <input type="password" id="new-pwd-confirm" class="form-input" placeholder="Xác nhận mật khẩu mới" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:8px;">
              <i class="fa-solid fa-shield-check"></i> Cập nhật
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
document.getElementById('btn-toggle-pwd').addEventListener('click', function() {
  const form = document.getElementById('form-change-pwd');
  const icon = document.getElementById('pwd-icon');
  if (form.style.display === 'none') {
    form.style.display = 'flex';
    icon.classList.remove('fa-chevron-down');
    icon.classList.add('fa-chevron-up');
  } else {
    form.style.display = 'none';
    icon.classList.remove('fa-chevron-up');
    icon.classList.add('fa-chevron-down');
  }
});

let toastTimer;
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  if(!t) return;
  const icons = {success:'fa-circle-check',error:'fa-circle-xmark'};
  t.className = `toast ${type} show`;
  t.innerHTML = `<i class="fa-solid ${icons[type] || icons.success}"></i><span>${msg}</span>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 3500);
}

document.getElementById('form-change-pwd').addEventListener('submit', async function(e) {
    e.preventDefault();
    const oldp = document.getElementById('old-pwd').value;
    const newp = document.getElementById('new-pwd').value;
    const conf = document.getElementById('new-pwd-confirm').value;
    
    if(newp !== conf) {
        showToast('Mật khẩu xác nhận không khớp.', 'error');
        return;
    }
    
    if(newp.length < 8) {
        showToast('Mật khẩu mới phải từ 8 ký tự trở lên.', 'error');
        return;
    }
    
    try {
        const fd = new FormData();
        fd.append('old_password', oldp);
        fd.append('new_password', newp);
        
        const r = await fetch('/api/auth/change-password', {
           method: 'POST',
           body: fd
        });
        const res = await r.json();
        
        if(r.ok && res.status === 'success') {
           showToast('Cập nhật mật khẩu thành công!', 'success');
           document.getElementById('form-change-pwd').reset();
        } else {
           showToast(res.message || res.detail || 'Có lỗi xảy ra', 'error');
        }
    } catch(err) {
        console.error(err);
        showToast('Đã xảy ra lỗi mạng. Vui lòng thử lại.', 'error');
    }
});
</script>
</body>
</html>
